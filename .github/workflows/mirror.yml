name: mirror
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch upstream lists
        run: |
          set -euo pipefail
          mkdir -p out
          base=https://github.com/1andrevich/Re-filter-lists/releases/latest/download
          curl -fsSL --retry 3 --retry-delay 5 -o out/refilter_domains.lst "$base/domains_all.lst"
          curl -fsSL --retry 3 --retry-delay 5 -o out/refilter_ipsum.lst "$base/ipsum.lst"
          for f in out/refilter_domains.lst out/refilter_ipsum.lst; do
            s=$(stat -c%s "$f"); l=$(wc -l < "$f"); echo "$f: $s bytes, $l lines"
            [ "$s" -gt 100000 ] && [ "$l" -gt 1000 ] || { echo "sanity check failed for $f"; exit 1; }
          done
          (cd out && sha256sum refilter_domains.lst refilter_ipsum.lst > SHA256SUMS)
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=lists
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "lists" --latest \
              --notes "Mirror of 1andrevich/Re-filter-lists (domains_all.lst -> refilter_domains.lst, ipsum.lst -> refilter_ipsum.lst). Refreshed every 4 hours."
          gh release upload "$tag" out/refilter_domains.lst out/refilter_ipsum.lst out/SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
